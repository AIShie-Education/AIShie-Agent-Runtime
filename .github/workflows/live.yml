name: Live providers

# The TypeScript runner against the real model APIs, nightly: every provider
# family whose existing key variables are set gets a one-token /probe through
# the same loopback server used in production. A provider without a key is
# skipped, and the log says so: a run with no key at all passes having tried
# nothing. No Go LLM adapter or live-Core fixture remains.
#
# Keys are repository secrets; the models, and Azure's endpoint and
# deployment, are repository variables, so that a cheaper model can be
# chosen without a commit.

on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --prefix runner
      - run: npm run build --prefix runner
      - name: Start the loopback runner
        run: |
          node runner/dist/index.js >"$RUNNER_TEMP/aishie-runner.log" 2>&1 &
          echo $! >"$RUNNER_TEMP/aishie-runner.pid"
          for _ in $(seq 1 60); do
            if node -e 'fetch("http://127.0.0.1:3001/healthz").then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))'; then
              exit 0
            fi
            sleep 0.25
          done
          cat "$RUNNER_TEMP/aishie-runner.log"
          exit 1
      - run: make live
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          OPENAI_RESPONSES_MODEL: ${{ vars.OPENAI_RESPONSES_MODEL }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_BASE_URL: ${{ vars.AZURE_OPENAI_BASE_URL }}
          AZURE_OPENAI_DEPLOYMENT: ${{ vars.AZURE_OPENAI_DEPLOYMENT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          BEDROCK_MODEL: ${{ vars.BEDROCK_MODEL }}
      - name: Stop the loopback runner
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/aishie-runner.pid" ]; then
            kill -TERM "$(cat "$RUNNER_TEMP/aishie-runner.pid")" 2>/dev/null || true
          fi
