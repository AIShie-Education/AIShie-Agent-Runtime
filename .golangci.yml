version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose      # unclosed HTTP response bodies
    - sqlclosecheck  # unclosed rows and statements
    - rowserrcheck   # rows.Err() never checked
    - errorlint      # errors compared with == instead of errors.Is
    - gosec
    - misspell
    - nolintlint
    - unconvert
  settings:
    nolintlint:
      require-specific: true
  exclusions:
    generated: strict
    rules:
      # Tests and the test doubles (the fake Core, the scripted model, the
      # store's shared suite) build what they need from fixed strings and
      # ignore cleanup errors freely.
      - path: (_test\.go|internal/fakecore/|internal/llm/fakellm/|internal/store/storetest/)
        linters: [gosec, errcheck]

formatters:
  enable:
    - gofmt
