# Release binaries. Images are built by release.yml with buildx, so that they
# share the Dockerfile CI already proves builds.
version: 2

project_name: aishie-runtime

before:
  hooks:
    - go mod download

builds:
  - id: aishie-runtime
    main: ./cmd/aishie-runtime
    binary: aishie-runtime
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    # The same version, commit and date as the image (release.yml passes the
    # last two in), and the version as `make build` has it: v1.2.3, not 1.2.3.
    ldflags:
      - -s -w
      - -X github.com/AIShiteru-LMS/AIShie-Agent-Runtime/internal/version.Version={{ if .IsSnapshot }}{{ .Version }}{{ else }}{{ .Tag }}{{ end }}
      - -X github.com/AIShiteru-LMS/AIShie-Agent-Runtime/internal/version.Commit={{ or (index .Env "SHORT_COMMIT") .ShortCommit }}
      - -X github.com/AIShiteru-LMS/AIShie-Agent-Runtime/internal/version.Date={{ or (index .Env "COMMIT_DATE") .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}" # reproducible: the same commit gives the same bytes

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    # Globs, so that a file or directory that is not there yet is left out
    # rather than failing the release. The example configuration goes with
    # the binary: an agent's YAML, the runtime's, a price table.
    files: [README*.md, docs/*.md, examples/**]

checksum:
  name_template: checksums.txt

changelog:
  use: git
  sort: asc
  groups:
    - { title: "Store schema — run `aishie-runtime migrate up` before starting this version", regexp: '(?i)migration', order: 0 }
    - { title: Changes, order: 999 }
  filters:
    exclude: ['^Merge ']

release:
  # A tag like v1.2.3-rc.1 is published as a pre-release and leaves "latest" alone.
  prerelease: auto
  header: |
    Binaries for Linux and macOS, and a multi-architecture image at
    `ghcr.io/aishie-education/aishie-agent-runtime:{{ .Version }}`.

    `run` never migrates on its own, and refuses a store whose schema is
    older than it. If this version carries new migrations (the release
    workflow lists them below when it does), run `aishie-runtime migrate up`
    before starting it; `aishie-runtime-deploy` does that on a server.
