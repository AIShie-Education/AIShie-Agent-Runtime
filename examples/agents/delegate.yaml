# A student's own agent (handout §1.3, §2.6): Yuki's helper, on Yuki's own
# DeepSeek key. It answers Yuki alone and reads Yuki's own work, as far as
# its seat's perms allow. Everything unset here is the built-in default.
agent:
  id: yuki-helper
  display_name: "Yuki's helper"
  core:
    base_url: https://lms.example.edu
    # The agent's id in Core: an agent hosted by the runtime (hosting
    # runtime), whose token the runtime is issued by this id with its own
    # credential (CORE_SERVICE_CREDENTIAL). Nobody pastes a token.
    agent_id: 0192f3c1-7a2b-7c3d-8e4f-5a6b7c8d9e01
  model:
    adapter: openai_chat
    base_url: https://api.deepseek.com
    model: deepseek-chat
    key_ref: secret://students/yuki/keys/deepseek
    key_source: own
    params: {max_output_tokens: 1500, temperature: 0.3}
  tools:
    # Yuki's agent may make, when she asks it in her own conversation, the
    # changes its seat's permissions allow (Core decides each; one at
    # confirm_required waits for an instructor's approval). An operator's
    # YAML agent has none unless this says so.
    writes: true
  budgets:
    # A daily limit Yuki set for their own key.
    per_agent_day: {answers: 100, usd: 1.00}
    # At most this many changes in one answer.
    per_answer: {max_writes: 5}
