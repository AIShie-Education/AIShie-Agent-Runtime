# The runtime's own settings: one `runtime:` document in all.
#
# Load these examples together:
#   CONFIG=examples/runtime.yaml,examples/agents aishie-runtime check
# (examples/ itself also holds the price table, which is not configuration.)
runtime:
  # The price table, relative to this file (package pricing). PRICES, when
  # set, is used instead.
  prices_ref: prices.example.yaml

  # Daily quotas across a tenant's agents on the school's key (§5.2, §5.3).
  # An agent on the school's key names its tenant, which must be here with a
  # per_day quota.
  tenants:
    ten_instr_42:
      per_day: {usd: 50.00, answers: 5000}

  # The models the school's key may use, as adapter:provider:model with *
  # for any text. Unset, the school's key may use any model not denied.
  allowed_models:
    - "anthropic:anthropic:claude-*"
    - "openai_chat:deepseek:deepseek-*"
    - "openai_chat:openrouter:meta-llama/*"

  # Models no agent may use, on any key.
  denied_models:
    - "*:*:*-preview"

  # The school's AI plan: the models the school offers people who host
  # their own agents on this runtime, paid for on the school's key. An
  # owner picks an offer by its id; the key stays a file on this server
  # (SECRETS_DIR/school/keys/<name>, or AISHIE_SECRET_SCHOOL_KEYS_<NAME>)
  # and is never shown, stored in the database or sent to the browser.
  # Quotas count answers since 00:00 UTC. Without offers, hosted agents
  # run on their owners' own keys alone.
  school:
    offers:
      - id: standard
        label: "School AI (Claude Haiku)"
        adapter: anthropic
        model: claude-haiku-4-5
        key_ref: secret://school/keys/anthropic-main
        params: {max_output_tokens: 1500}
      - id: deepseek
        label: "School AI (DeepSeek)"
        adapter: openai_chat
        model: deepseek-chat
        base_url: https://api.deepseek.com
        key_ref: secret://school/keys/deepseek
      # A model at OpenRouter, which passes each call to one of the
      # upstream providers serving it. `openrouter:` is OpenRouter's
      # upstream routing (its `provider` object, sent with every call;
      # docs/deploying.md): here, only upstreams that keep no data, among
      # three named, Groq tried first, each running the model at fp8 or
      # better, and none charging more than the price table counts the
      # model at (prices.example.yaml). Left out, OpenRouter chooses by
      # price and uptime among all of them.
      - id: llama
        label: "School AI (Llama 3.3 70B)"
        adapter: openai_chat
        model: meta-llama/llama-3.3-70b-instruct
        base_url: https://openrouter.ai/api/v1
        key_ref: secret://school/keys/openrouter
        openrouter:
          data_collection: deny       # only upstreams that keep no data
          require_parameters: true    # only upstreams that take every setting, tools included
          allow_fallbacks: true       # if Groq cannot answer, the others may
          only: [groq, deepinfra, together]
          order: [groq]               # tried first
          quantizations: [fp8, fp16, bf16, unknown]
          max_price: {prompt: "1.04", completion: "1.04"}   # dollars per million tokens
    # Per owner, across all of their agents on the plan (default 100); per
    # asker, per agent and course (default 20); and, when set, a ceiling
    # across everything on the school's key. Each may also take usd:, which
    # needs a price table that prices every offer.
    per_owner_day: {answers: 100}
    per_asker_day: {answers: 20}
    per_day: {answers: 5000}
    # The notice posted when a quota of the plan's is spent and the owner
    # has no key of their own behind it. Left out, it is the built-in one,
    # in English and Chinese.
    # on_quota_text: "今天的學校 AI 額度已用完，請明天再試。"

  # Settings every agent starts from, over the built-in defaults and under
  # the agent's own. Here, the school's own words for the quota notice.
  defaults:
    prompt:
      on_quota_text: >-
        I've answered as many questions as I can today. Please try again
        tomorrow, or ask your instructor in class.
